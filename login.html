<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FK-SCEMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="left-panel">
            <div class="info-content">
                <img src="images/umpsaLogo.png" alt="UMPSA Logo" class="logo">
                <h2>FK-SCEMS</h2>
                <p class="system-name">FK Student Club & Event Management System</p>
                <p class="university">Universiti Malaysia Pahang Al-Sultan Abdullah</p>
                <p class="location">Pekan | Gambang</p>
            </div>
        </div>

        <div class="right-panel">
            <div class="login-box">
                <h1>Welcome Back</h1>
                <p class="subtitle">Please enter your credentials to access the portal</p>

                <form>
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" placeholder="e.g. CB24001">
                    </div>

                    <div class="input-group">
                        <div class="label-row">
                            <label>Password</label>
                            <a href="#" class="forgot-link">Forgot password</a>
                        </div>
                        <input type="password" placeholder="••••••">
                    </div>

                    <a href="dashboardSwitcher.html" class="sign-in-btn">Sign in</a>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
